name: Windows test build

# On demand: builds the Windows binaries without publishing a release (for testing in
# Wine or on a Windows PC). Actions -> "Windows test build" -> "Run workflow".
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: netherNode-windows-test
          path: |
            target/release/nethernode-gui.exe
            target/release/nethernode.exe
