name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x64, os: ubuntu-latest }
          - { name: Linux ARM64, os: ubuntu-24.04-arm }
          - { name: Windows x64, os: windows-latest }
          - { name: macOS Apple Silicon, os: macos-latest }
          - { name: macOS Intel, os: macos-13 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - if: runner.os == 'macOS'
        run: packaging/macos/make-app.sh
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: netherNode-app-${{ runner.arch }}
          path: target/release/netherNode.app
      - uses: actions/upload-artifact@v4
        with:
          name: nethernode-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/nethernode
            target/release/nethernode.exe
            target/release/nethernode-gui
            target/release/nethernode-gui.exe
          if-no-files-found: error
