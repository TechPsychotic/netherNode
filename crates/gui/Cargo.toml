[package]
name = "nethernode-gui"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = "0.3.34"
iced = { version = "0.14.0", features = ["image-without-codecs", "tokio"] }
nethernode-core = { version = "0.1.0", path = "../core" }
png = "0.18.1"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "io-util", "process", "sync", "time"] }

[build-dependencies]
winresource = "0.1.34"
