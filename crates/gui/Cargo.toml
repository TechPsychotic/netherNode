[package]
name = "nethernode-gui"
version = "1.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
futures = "0.3.34"
iced = { version = "0.14.0", features = ["image-without-codecs", "tokio"] }
nethernode-core = { version = "1.1.0", path = "../core" }
notify-rust = "4.18.2"
png = "0.18.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "io-util", "process", "sync", "time"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[build-dependencies]
winresource = "0.1.34"
