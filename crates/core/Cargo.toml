[package]
name = "nethernode-core"
version = "1.2.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
bytes = "1"
base64 = "0.23.1"
directories = "6.0.0"
futures = "0.3.34"
getrandom = "0.4.3"
fastnbt = "2.6.3"
hex = "0.4.3"
iroh = { version = "1.4", default-features = false, features = ["tls-aws-lc-rs", "portmapper"] }
iroh-dns = { version = "1.4.1", default-features = false }
md-5 = "0.11.0"
os_info = "3.15.0"
png = "0.18.1"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json", "query", "stream"] }
rsa = { version = "0.9", features = ["getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
socket2 = { version = "0.6", features = ["all"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "fs", "process", "sync", "time", "io-util"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
