[package]
name = "nethernode-core"
version = "0.1.0"
edition = "2024"

[dependencies]
directories = "6.0.0"
futures = "0.3.34"
hex = "0.4.3"
md-5 = "0.11.0"
os_info = "3.15.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json", "query", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "fs", "process", "sync", "time", "io-util"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
