<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- netherNode app icon: a portal frame holding an "N" drawn as connected nodes. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2430"/>
      <stop offset="1" stop-color="#151218"/>
    </linearGradient>
    <linearGradient id="portal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a4a"/>
      <stop offset="0.5" stop-color="#e8613c"/>
      <stop offset="1" stop-color="#8b3fe0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#ffd2a6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd2a6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <!-- obsidian frame -->
  <rect x="112" y="72" width="288" height="368" rx="36" fill="#3b2c48"/>
  <rect x="112" y="72" width="288" height="368" rx="36" fill="none" stroke="#56406a" stroke-width="6"/>
  <!-- portal -->
  <rect x="148" y="108" width="216" height="296" rx="18" fill="url(#portal)"/>
  <rect x="148" y="108" width="216" height="296" rx="18" fill="url(#glow)"/>
  <!-- the N, as nodes joined by links -->
  <path d="M200 344 V168 L312 344 V168" fill="none" stroke="#fff7f0" stroke-width="26"
        stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#fff7f0">
    <circle cx="200" cy="344" r="28"/>
    <circle cx="200" cy="168" r="28"/>
    <circle cx="312" cy="344" r="28"/>
    <circle cx="312" cy="168" r="28"/>
  </g>
</svg>
